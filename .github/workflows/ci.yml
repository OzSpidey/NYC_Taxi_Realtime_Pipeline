name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ function_app/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────
  dbt-compile:
    name: dbt compile (dry-run)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-synapse
        run: pip install dbt-synapse

      - name: dbt compile
        working-directory: dbt
        env:
          DBT_SYNAPSE_SERVER:   placeholder.sql.azuresynapse.net
          DBT_SYNAPSE_DATABASE: placeholder
        run: dbt compile --profiles-dir . --target dev

  # ────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var="env=dev" -no-color

  # ────────────────────────────────────────────────────────────
  deploy-function:
    name: Deploy Azure Function (main only)
    runs-on: ubuntu-latest
    needs: [test, dbt-compile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: function_app/
          scm-do-build-during-deployment: true
